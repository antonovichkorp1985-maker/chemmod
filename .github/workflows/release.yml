name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the NeoForge jar
        run: ./scripts/smoke-test.sh
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(find mod/build/libs -maxdepth 1 -type f -name 'chemmod-*.jar' ! -name '*sources*' -print -quit)
          test -n "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "$artifact" "$artifact.sha256" \
            --prerelease \
            --title "ChemMod $GITHUB_REF_NAME — техническая тестовая сборка" \
            --notes "Тестовая сборка ChemMod для Minecraft 1.21.1 / NeoForge 21.1.251. Состав воды теперь зависит не только от биома, но и от блоков рядом, глубины и дождя. Анализ учитывает осадок, растительность, сельское хозяйство, руды и геотермальную активность; результат и причины сохраняются в колбе. Схема data component v3 мигрирует старые колбы. Эталонные creative-образцы имеют чистоту 100%. CLI в релиз не входит. ChemMod — All Rights Reserved."
