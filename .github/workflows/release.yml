name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the NeoForge jar
        run: ./scripts/smoke-test.sh
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(find mod/build/libs -maxdepth 1 -type f -name 'chemmod-*.jar' ! -name '*sources*' -print -quit)
          test -n "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          notes=$(cat <<'EOF'
          Тестовая сборка ChemMod для Minecraft 1.21.1 / NeoForge 21.1.251.

          Химическое ядро переработано по плану проекта: молекулярный граф с валидацией
          и каноническим ID определяет вещество; свойства вычисляются отдельным чистым
          движком по JSON-коэффициентам; реакции интерпретируются из JSON-правил с
          проверкой среды и автоматической балансировкой. Тривиальные названия являются
          только словарём алиасов и больше не разрешают или запрещают существование
          молекулы. Незарегистрированные валидные молекулы могут получать предсказанные
          свойства и участвовать в подходящих правилах реакции.

          M4/M5-фундамент сохранён: физическое обогащение меди, анализ воды/TFC и
          опциональный адаптер Create 6.0.10. Create не встраивается в JAR; без него
          ChemMod остаётся запускаемым и не регистрирует compat-контент. Радиационная
          подсистема в этом релизе не менялась. CLI в релиз не входит.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" \
            "$artifact" "$artifact.sha256" \
            --prerelease \
            --title "ChemMod $GITHUB_REF_NAME — техническая тестовая сборка" \
            --notes "$notes"
