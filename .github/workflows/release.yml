name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the NeoForge jar
        run: ./scripts/smoke-test.sh
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(find mod/build/libs -maxdepth 1 -type f -name 'chemmod-*.jar' ! -name '*sources*' -print -quit)
          test -n "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          notes=$(cat <<'EOF'
          Тестовая сборка ChemMod для Minecraft 1.21.1 / NeoForge 21.1.251.

          ## Что проверить в этой сборке

          - Молекулярный граф с validation/canonical ID остаётся единственным источником
            идентичности вещества. Имена — только необязательные content-алиасы.
          - Колба теперь сохраняет явную многокомпонентную смесь: каждый компонент несёт
            проверяемый structural witness и точное количество в микромолях.
          - В creative-вкладке есть калибровочная смесь воды и этанола. Наведите курсор,
            чтобы увидеть её компоненты, формулы и количества; расширенная подсказка
            показывает canonical keys.
          - Для точного смешивания в survival присядьте и используйте заполненную колбу,
            держа ровно одну другую заполненную колбу в противоположной руке. Первая
            колба станет суммарным составом, вторая — пустой. Нечистые и некорректные
            образцы не должны терять массу: операция отменяется без изменения входов.

          Это ещё не пользовательский реактор: смешивание не запускает реакцию и не
          создаёт discovery. Машина синтеза, разделение, фазы и равновесие остаются
          следующими слоями. Физическое обогащение меди, анализ воды/TFC и optional
          Create 6.0.10 adapter сохранены; Create не встраивается в JAR. CLI в релиз
          не входит.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" \
            "$artifact" "$artifact.sha256" \
            --prerelease \
            --title "ChemMod $GITHUB_REF_NAME — техническая тестовая сборка" \
            --notes "$notes"
