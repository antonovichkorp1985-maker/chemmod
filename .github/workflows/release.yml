name: Release

on:
  push:
    branches:
      - "arena/bb7eef66-chemmod"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact test tag matching the selected branch's project version"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: chemmod-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # Only an explicit release-request commit publishes from the work branch.
    # Ordinary development pushes and pull requests cannot publish a release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/arena/bb7eef66-chemmod' &&
       startsWith(github.event.head_commit.message, 'release: publish '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release identity and documents
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_release_metadata.py'
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG=$(python3 scripts/release_metadata.py | sed -n 's/^tag=//p')
            test "$(git log -1 --format=%s)" = "release: publish $RELEASE_TAG"
          fi
          python3 scripts/release_metadata.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          source_sha=$(git rev-parse HEAD)
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          # Existing tags must resolve to this exact source commit, never a
          # different build. The publisher does not overwrite tags or releases.
          if git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$source_sha"
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the NeoForge jar
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./scripts/smoke-test.sh 2>&1 | tee release-build.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo '```text'
            tail -n 200 release-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" -ne 0 ]]; then
            grep -Ei 'error|failed|failure|exception|assert|^e: ' release-build.log \
              | grep -vE '^(core|core-cli|mod) |^JUnit totals:' \
              | tail -n 20 | cut -c 1-300 > release-failure-lines.txt || true
            while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error title=Release test diagnostic::$escaped"
            done < release-failure-lines.txt
            diagnostic=$(tail -n 40 release-build.log | cut -c 1-300 | sed 's/%/%25/g; s/\r/%0D/g; s/$/%0A/' | tr -d '\n')
            echo "::error title=Release build failed::$diagnostic"
          fi
          exit "$status"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          ARTIFACT: ${{ steps.metadata.outputs.artifact }}
          NOTES: ${{ steps.metadata.outputs.notes }}
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_metadata.py "$RELEASE_TAG" --verify-jar
          artifact_dir=$(dirname "$ARTIFACT")
          artifact_name=$(basename "$ARTIFACT")
          (
            cd "$artifact_dir"
            sha256sum "$artifact_name" > "$artifact_name.sha256"
            sha256sum -c "$artifact_name.sha256"
          )
          notes_file="$RUNNER_TEMP/chemmod-release-notes.md"
          cp "$NOTES" "$notes_file"
          {
            printf '\n## Идентичность сборки\n\nИсходный commit: `%s`.\n\nSHA-256 JAR: `%s`.\n' \
              "$SOURCE_SHA" "$(sha256sum "$ARTIFACT" | cut -d ' ' -f 1)"
          } >> "$notes_file"
          # A full semver version publishes as a real release; only the explicit
          # -test.N candidates are marked as prereleases. The flag comes from the
          # metadata contract, never from a hand-edited workflow step.
          release_kind=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_kind=(--prerelease --title "ChemMod $RELEASE_TAG — immutable player-test candidate")
          else
            release_kind=(--latest --title "ChemMod $RELEASE_TAG")
          fi
          # --target pins creation of a new tag to this tested commit even when
          # dispatched from a work branch. Existing releases are never edited.
          gh release create "$RELEASE_TAG" \
            "$ARTIFACT" "$ARTIFACT.sha256" \
            --target "$SOURCE_SHA" \
            "${release_kind[@]}" \
            --notes-file "$notes_file"
