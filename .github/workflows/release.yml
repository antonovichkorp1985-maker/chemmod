name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the NeoForge jar
        run: ./scripts/smoke-test.sh
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(find mod/build/libs -maxdepth 1 -type f -name 'chemmod-*.jar' ! -name '*sources*' -print -quit)
          test -n "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "$artifact" "$artifact.sha256" \
            --prerelease \
            --title "ChemMod $GITHUB_REF_NAME — техническая тестовая сборка" \
            --notes "Тестовая сборка ChemMod для Minecraft 1.21.1 / NeoForge 21.1.251. M5 добавляет опциональный адаптер Create 6.0.10: кинетический сепаратор руды потребляет вращение и стандартные ItemHandler-порты, но читает сохранённую физическую партию ChemMod, резервирует выходы и выпускает ровно фактическую массу меди и каждой примеси — без статического дублирующего рецепта, случайных дропов или создания массы. Create не встраивается в JAR; без него ChemMod остаётся полностью запускаемым и не регистрирует compat-контент. M4-фундамент сохраняется: material_batch v2, анализ воды/TFC, отдельные хвосты, накопление расплава и точное литьё 1 кг. Код, рецепты, имена и ассеты GregTech или Create не копировались. CI включает unit-, JAR- и два headless dedicated-server прогона: standalone и с Create. CLI в релиз не входит. ChemMod — All Rights Reserved."
