name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the NeoForge jar
        run: ./scripts/smoke-test.sh
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(find mod/build/libs -maxdepth 1 -type f -name 'chemmod-*.jar' ! -name '*sources*' -print -quit)
          test -n "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "$artifact" "$artifact.sha256" \
            --prerelease \
            --title "ChemMod $GITHUB_REF_NAME — техническая тестовая сборка" \
            --notes "Тестовая сборка ChemMod для Minecraft 1.21.1 / NeoForge 21.1.251. M4 завершает физический фундамент медного обогащения: material_batch v2 хранит точные массы компонентов и автоматически читает старые ppm-партии v1. Промывка по сохранённому анализу воды теперь выдаёт концентрат и отдельные хвосты, не создавая медь; новый сепаратор руды выделяет оставшуюся пустую породу и чистую медную пыль. Частичные чистые партии можно накапливать в тигле, а изложница отливает ровно 1 кг с сохранением остатка. Чистая, солёная, болотная и TFC-вода дают разные, сохранённые сервером результаты; быстрый нечистый маршрут остаётся доступным. Код, рецепты, имена и ассеты GregTech не копировались. CI включает unit-, JAR- и headless dedicated-server проверку. CLI в релиз не входит. ChemMod — All Rights Reserved."
