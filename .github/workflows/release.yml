name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the NeoForge jar
        run: ./scripts/smoke-test.sh
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(find mod/build/libs -maxdepth 1 -type f -name 'chemmod-*.jar' ! -name '*sources*' -print -quit)
          test -n "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "$artifact" "$artifact.sha256" \
            --prerelease \
            --title "ChemMod $GITHUB_REF_NAME — техническая тестовая сборка" \
            --notes "Тестовая сборка ChemMod для Minecraft 1.21.1 / NeoForge 21.1.251. Добавлены блок руды самородной меди, добыча канонического рудного куска и data-driven генерация жил в новых чанках обычного мира между Y=-32 и Y=80. Для добычи нужна каменная кирка или лучше. Формы меди сохраняют MaterialBatch с массой, чистотой и примесями; добавлены c:-теги руды. Контент и worldgen TFC не отключаются. Интеграция воды TFC сохранена. CLI в релиз не входит. ChemMod — All Rights Reserved."
