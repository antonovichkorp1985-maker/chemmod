name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./gradlew --no-daemon check installDist 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo '```text'
            tail -n 200 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" -ne 0 ]]; then
            diagnostic=$(tail -n 80 build.log | sed 's/%/%25/g; s/\r/%0D/g; s/$/%0A/' | tr -d '\n')
            echo "::error title=Gradle build failed::$diagnostic"
          fi
          exit "$status"
