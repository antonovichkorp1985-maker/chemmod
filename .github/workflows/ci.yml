name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate prerelease metadata
        id: metadata
        run: |
          python3 -m unittest discover -s scripts -p 'test_release_metadata.py'
          python3 scripts/release_metadata.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./scripts/smoke-test.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo '```text'
            tail -n 200 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" -ne 0 ]]; then
            diagnostic=$(tail -n 80 build.log | sed 's/%/%25/g; s/\r/%0D/g; s/$/%0A/' | tr -d '\n')
            echo "::error title=Gradle build failed::$diagnostic"
          fi
          exit "$status"
      # This is deliberately a short-lived CI artifact, not a GitHub release:
      # Exact-commit builds remain available alongside numbered player-test
      # prereleases; neither artifact type closes the manual M3 acceptance gate.
      - name: Write manual-acceptance checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_metadata.py --verify-jar
          artifact="${{ steps.metadata.outputs.artifact }}"
          artifact_name=$(basename "$artifact")
          cd "$(dirname "$artifact")"
          sha256sum "$artifact_name" > "$artifact_name.sha256"
          sha256sum -c "$artifact_name.sha256"
      - name: Upload M3 manual-acceptance JAR
        uses: actions/upload-artifact@v4
        with:
          name: chemmod-m3-manual-acceptance-${{ github.sha }}
          path: |
            mod/build/libs/chemmod-*.jar
            !mod/build/libs/*sources*.jar
            mod/build/libs/chemmod-*.jar.sha256
          if-no-files-found: error
          retention-days: 14
